# Shajarah release pipeline. Nothing is ever published by this workflow:
# it ends with a DRAFT release, which installed copies cannot see. A person
# publishes the draft on GitHub; shajarah-release-verify.yml then checks the
# live update.
#
#   checks    Linux: typecheck, lint, every unit test (GEDCOM, project files,
#             start-up safety with the real embedded PostgreSQL), the layout QA
#   database  Linux + PostgreSQL 16: the migrations from empty and over the
#             previous release's schema; no schema change unless allowed
#   build     Windows: installer, silent install, smoke test twice, the
#             start-up safety tests with the Windows PostgreSQL
#   upgrade   Windows, one runner per earlier release with an installer: a
#             family made by that release survives the update made by that
#             release's own updater (from a local feed); for the newest one
#             also the recovery test, reinstalling it, and the 1.0.51 defect
#             reproduced (red proof)
#   draft     every job above passed: the draft release (replaced while it is
#             still a draft; a published version is never touched: when the
#             version is already published the job ends with a notice, green)
name: Shajarah release pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "shajarah/**"
      - ".github/workflows/shajarah-*.yml"

permissions:
  contents: write

concurrency:
  group: shajarah-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 1.0.52 changes no schema: any change to the migrations fails the run
  ALLOW_SCHEMA_CHANGE: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: shajarah
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shajarah/package-lock.json
            shajarah/desktop/electron/package-lock.json
      - name: Install
        run: |
          npm ci
          (cd desktop/electron && npm ci --omit=dev)
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint --max-warnings 0
      - name: Unit tests (GEDCOM, project files, start-up safety, layout)
        env:
          REQUIRE_PG: "1"
        run: npx vitest run
      - name: Layout QA (every case against its baseline)
        env:
          QA_LAYOUT: "1"
        run: npx vitest run tests/qa

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shajarah
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shajarah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shajarah" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: shajarah
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Previous release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "previous release: $prev"
      - name: No schema change unless allowed
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          if git diff --quiet "$PREV" -- prisma/migrations prisma/schema.prisma; then
            echo "migrations and schema identical to $PREV"
          elif [ "$ALLOW_SCHEMA_CHANGE" = "true" ]; then
            git diff --stat "$PREV" -- prisma/migrations prisma/schema.prisma
          else
            git diff --stat "$PREV" -- prisma/migrations prisma/schema.prisma
            echo "::error::The schema changed, but this release allows no schema change"; exit 1
          fi
      - name: Migrate the previous release's schema, then this one (the desktop runner)
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          (cd desktop/electron && npm ci --omit=dev --ignore-scripts)
          mkdir -p /tmp/prev && git archive "$PREV" prisma/migrations | tar -x -C /tmp/prev
          node -e '
            const { migrate } = require("./desktop/electron/migrate.js");
            const url = "postgresql://shajarah:ci-only@127.0.0.1:5432/shajarah";
            (async () => {
              console.log("previous release:", await migrate(url, "/tmp/prev/prisma/migrations"));
              console.log("this release:", await migrate(url, "prisma/migrations"));
              console.log("again (must be none):", await migrate(url, "prisma/migrations"));
            })().catch((e) => { console.error(e); process.exit(1); });'
      - name: Prisma agrees the database matches the schema
        env:
          DATABASE_URL: postgresql://shajarah:ci-only@127.0.0.1:5432/shajarah
        run: |
          npm ci --ignore-scripts
          npx prisma migrate status

  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: shajarah
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shajarah/package-lock.json
            shajarah/desktop/electron/package-lock.json
      - id: version
        working-directory: shajarah/desktop/electron
        run: '"version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'
      - name: Build the app (standalone server)
        env:
          NEXT_OUTPUT: standalone
        run: |
          npm ci
          npm run build
      - name: Build the installer
        working-directory: shajarah/desktop/electron
        run: |
          npm ci
          npm run prepare-app
          npx electron-builder --win nsis --publish never
          Get-ChildItem dist -File | Format-Table Name, Length
          if (-not (Test-Path dist/latest.yml)) { throw "No update information (latest.yml) was built" }
      - name: Start-up safety tests with the Windows PostgreSQL
        env:
          REQUIRE_PG: "1"
        run: npx vitest run tests/desktop-startup.test.ts
      - name: Install it and run the smoke test (first and second launch)
        working-directory: shajarah/desktop/electron
        run: |
          $setup = Get-ChildItem dist -Filter 'Shajarah-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Shajarah\Shajarah.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $logs = Join-Path $env:APPDATA 'Shajarah\logs'
          foreach ($launch in 'first', 'second') {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The $launch launch did not finish in 5 minutes" }
            $result = Get-Content (Join-Path $logs 'smoke-test.txt')
            "$launch launch: $result (whole run $([int]$clock.Elapsed.TotalSeconds) s)"
            if ($p.ExitCode -ne 0) { Get-Content (Join-Path $logs 'shajarah.log'); throw "Smoke test failed on the $launch launch" }
          }
          Get-Content (Join-Path $logs 'shajarah.log')
          $seconds = [double](($result | Select-String '"startupSeconds":([0-9.]+)').Matches[0].Groups[1].Value)
          if ($seconds -gt 20) { throw "The second launch took $seconds s to start (limit 20 s)" }
          # a fresh install keeps its database in a folder of its own
          if (-not (Test-Path (Join-Path $env:APPDATA 'Shajarah\database\active.json'))) { throw "A fresh install should record its database folder in active.json" }
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            shajarah/desktop/electron/dist/Shajarah-Setup-*.exe
            shajarah/desktop/electron/dist/Shajarah-Setup-*.exe.blockmap
            shajarah/desktop/electron/dist/latest.yml
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/AppData/Roaming/Shajarah/logs
          if-no-files-found: ignore

  releases:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      newest: ${{ steps.list.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: shajarah/desktop/electron/package.json
          sparse-checkout-cone-mode: false
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # every published release older than this build that still has its
          # Windows installer (a release cannot update to its own version: a
          # push that does not bump the version is tested against the
          # releases before it)
          version=$(jq -r .version shajarah/desktop/electron/package.json)
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          tags=$(gh release list -R "$REPO" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')
          found=()
          for t in $tags; do
            if ! older "${t#v}" "$version"; then echo "not older than $version: $t"; continue; fi
            if gh release view "$t" -R "$REPO" --json assets --jq '.assets[].name' | grep -q '^Shajarah-Setup-.*\.exe$'; then found+=("$t"); fi
          done
          echo "releases with an installer: ${found[*]}"
          [ ${#found[@]} -gt 0 ] || { echo "::error::No earlier release with an installer"; exit 1; }
          echo "matrix=$(printf '%s\n' "${found[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "newest=${found[0]}" >> "$GITHUB_OUTPUT"

  upgrade:
    needs: [build, releases]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        from: ${{ fromJSON(needs.releases.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: shajarah/desktop/electron/scripts
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - name: Upgrade from ${{ matrix.from }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ matrix.from }}
          NEWEST: ${{ needs.releases.outputs.newest }}
          NEW_VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release download $env:FROM -R $env:REPO --pattern 'Shajarah-Setup-*.exe' --dir old
          $old = (Get-ChildItem old -Filter 'Shajarah-Setup-*.exe' | Select-Object -First 1).FullName
          $extra = @{}
          if ($env:FROM -eq $env:NEWEST) { $extra = @{ Recovery = $true; DownAndUp = $true } }
          # the red proof needs the defect itself: 1.0.51 was the last release to delete the database
          if ($env:FROM -eq 'v1.0.51') { $extra = $extra + @{ RedProof = $true } }
          & ./shajarah/desktop/electron/scripts/ci-upgrade.ps1 -OldInstaller $old -OldVersion $env:FROM.TrimStart('v') `
            -CandidateDir (Resolve-Path candidate).Path -NewVersion $env:NEW_VERSION @extra
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs-${{ matrix.from }}
          path: ~/AppData/Roaming/Shajarah/logs
          if-no-files-found: ignore

  draft:
    needs: [checks, database, build, upgrade]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - name: Draft release (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              # Every check above has passed. A change that does not bump the
              # version (docs, tests, work towards the next release) is not a
              # release: the published version is left untouched.
              echo "::notice::$tag is already published, so no draft was made. Bump desktop/electron/package.json to release this commit."
              exit 0
            fi
            gh release delete "$tag" --yes   # an older draft of the same version
          fi
          notes="shajarah/desktop/electron/release-notes/$VERSION.md"
          [ -f "$notes" ] || { echo "::error::Release notes $notes are missing"; exit 1; }
          gh release create "$tag" candidate/Shajarah-Setup-*.exe candidate/Shajarah-Setup-*.exe.blockmap candidate/latest.yml \
            --draft --target "$GITHUB_SHA" --title "Shajarah $VERSION" --notes-file "$notes"
          echo "Draft $tag created from $GITHUB_SHA. It is not visible to installed copies until a person publishes it."
