# After a person publishes a release: install the previous release on a clean
# Windows machine and update it through the REAL GitHub feed. The release is
# complete only when this passes.
#
# If it fails, the previous release is marked latest again and the new one
# returns to draft, so copies that have NOT updated yet are not offered it.
# This does not roll back copies that already updated: they need a newer
# fixed release (see the release notes' "Going back" section).
name: Shajarah release verification

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: shajarah-release-verify
  cancel-in-progress: false

jobs:
  live-update:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Update the previous release through the live feed
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Shajarah\Shajarah.exe'
          $logs = Join-Path $env:APPDATA 'Shajarah\logs'
          $installed = { if (Test-Path $exe) { "$((Get-Item $exe).VersionInfo.ProductVersion)" } else { "" } }
          $old = gh release list -R $env:REPO --exclude-drafts --limit 5 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne $env:NEW } | Select-Object -First 1
          "previous release: $old"
          try {
            gh release download $old -R $env:REPO --pattern 'Shajarah-Setup-*.exe' --dir previous
            Start-Process -FilePath (Get-ChildItem previous -Filter 'Shajarah-Setup-*.exe' | Select-Object -First 1).FullName -ArgumentList '/S' -Wait
            if (-not (& $installed).StartsWith($old.TrimStart('v'))) { throw "The previous version did not install" }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt 300) {
              try { $latest = ((Invoke-WebRequest -Uri "https://github.com/$env:REPO/releases/latest" -Headers @{ Accept = "application/json" } -UseBasicParsing).Content | ConvertFrom-Json).tag_name } catch { $latest = "" }
              if ($latest -eq $env:NEW) { break }
              Start-Sleep 10
            }
            for ($try = 1; $try -le 3; $try++) {
              $p = Start-Process -FilePath $exe -ArgumentList '--update-test' -PassThru
              if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The update check did not finish in 5 minutes" }
              Get-Content (Join-Path $logs 'update-test.txt')
              if ($p.ExitCode -eq 0) { break }
              if ($try -lt 3) { Start-Sleep 60 }
            }
            if ($p.ExitCode -ne 0) { throw "The update failed" }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            Start-Sleep 5
            while ((Get-Process -Name 'Shajarah-Setup*' -ErrorAction SilentlyContinue) -and $clock.Elapsed.TotalSeconds -lt 300) { Start-Sleep 3 }
            while (-not (& $installed).StartsWith($env:NEW.TrimStart('v')) -and $clock.Elapsed.TotalSeconds -lt 300) { Start-Sleep 5 }
            if (-not (& $installed).StartsWith($env:NEW.TrimStart('v'))) { throw "The update did not install" }
            Start-Sleep 10
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The updated program did not start" }
            Get-Content (Join-Path $logs 'smoke-test.txt')
            if ($p.ExitCode -ne 0) { throw "The updated program failed its smoke test" }
            "VERIFIED: $old updates to $env:NEW through the live feed"
          } catch {
            Get-Content (Join-Path $logs 'shajarah.log') -Tail 60 -ErrorAction SilentlyContinue
            "Live update failed: $_"
            "Feed rollback: $old becomes latest again; $env:NEW returns to draft. Copies that already updated are NOT rolled back."
            gh release edit $old -R $env:REPO --latest
            gh release edit $env:NEW -R $env:REPO --draft=true
            throw
          }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-update-logs
          path: ~/AppData/Roaming/Shajarah/logs
          if-no-files-found: ignore
